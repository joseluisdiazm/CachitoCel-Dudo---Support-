<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CachitoCel Dudo App Instructions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one centered phone-width column; big images stacked, short title above each. */
:root{
  --bg:#eceff3; --bg2:#ced4dd; --ink:#17302a; --mute:#4f5f5a;
  --mint:#0d6b49; --mint2:#48be82; --deep:#083828; --chip:#a0f8cc;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
body{background:var(--bg);background-image:linear-gradient(180deg,var(--bg) 0,var(--bg2) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.1;margin:0;color:var(--mint);text-wrap:balance}
.lede{margin:0;color:var(--mute);max-width:52ch}
.toggle{display:inline-flex;border:2px solid var(--mint2);border-radius:999px;padding:3px;gap:2px}
.toggle button{font:700 15px var(--font-body);color:var(--mint);background:transparent;border:0;border-radius:999px;padding:7px 18px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--chip);color:var(--deep)}
.toggle button:focus-visible,a:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
main{display:flex;flex-direction:column;gap:34px}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
figcaption{font-family:var(--font-display);font-weight:500;font-size:1.25rem;color:var(--mint)}
figure img{display:block;width:100%;height:auto;border-radius:20px;box-shadow:0 8px 24px rgba(20,30,50,.22)}
.more{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border-radius:20px;background:rgba(72,190,130,.14);border:2px solid var(--mint2)}
.more p{margin:0}
.more a{color:var(--mint);font-weight:700}
footer{color:var(--mute);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 18px}
footer a{color:var(--mint)}
.draft{font-size:13px;color:var(--mute);border:1px dashed var(--mint2);border-radius:10px;padding:6px 10px;align-self:flex-start}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

  <section class="more">

  </footer>
</div>
<script>
(function(){
  var cur='en';
  try{var s=localStorage.getItem('guideLang'); if(s==='en'||s==='es')cur=s; else if((navigator.language||'').toLowerCase().indexOf('es')===0)cur='es';}catch(e){
    if((navigator.language||'').toLowerCase().indexOf('es')===0)cur='es';}
  function apply(l){
    cur=l;
    document.documentElement.lang=l;
    document.querySelectorAll('[data-lang]').forEach(function(el){el.hidden=el.getAttribute('data-lang')!==l;});
    document.getElementById('b-en').setAttribute('aria-pressed',String(l==='en'));
    document.getElementById('b-es').setAttribute('aria-pressed',String(l==='es'));
    try{localStorage.setItem('guideLang',l);}catch(e){}
  }
  document.getElementById('b-en').addEventListener('click',function(){apply('en')});
  document.getElementById('b-es').addEventListener('click',function(){apply('es')});
  apply(cur);
})();
</script>

</body>
</html>
